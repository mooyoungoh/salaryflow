name: Staging PR merge email smoke test
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  smoke:
    if: ${{ github.event.pull_request.head.ref == 'data-review/notification-smoke-test' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify only harmless notification test file changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          CHANGED="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/files" --jq '.[].filename')"
          test "$CHANGED" = 'docs/notification-smoke-test.txt'
      - name: Comment PR creation notification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "@mooyoungoh Salary Flow email smoke test: PR created. This contains no salary, tax, or application changes."
      - name: Squash merge test PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash
      - name: Post merge completion notification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "@mooyoungoh Salary Flow email smoke test: automated squash merge completed. PR history: $PR_URL"
