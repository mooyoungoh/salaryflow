name: Find and stage next IRS tax tables
on:
  workflow_dispatch:
  schedule:
    - cron: '47 15 12 * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test official IRS parser
        run: node scripts/test-irs-parser.mjs
      - name: Discover next tax year's official IRS bulletin
        id: scan
        run: node scripts/discover-irs-tax.mjs
      - name: Stage candidate without activating current tax year
        if: steps.scan.outputs.found == 'true'
        run: |
          YEAR=$(node -p "require('./data/manifest.json').tax.year+1")
          mkdir -p data/candidates
          cp "candidates/tax-$YEAR.json" "data/candidates/tax-$YEAR.json"
          node scripts/validate-data.mjs
      - name: Open IRS candidate PR
        if: steps.scan.outputs.found == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: stage next-year IRS tax candidate'
          branch: data-review/irs-next-tax-year
          base: main
          title: '[IRS tax candidate] Verified annual tax tables'
          body: |
            Official IRS tax bulletin parsed with full bracket and deduction checks.
            Candidate file only: no changes to data/manifest.json or live tax year.
            The atomic activation workflow will wait for matching SSA, Arizona,
            and the start of the tax year before applying all three together.
            Site: https://mooyoungoh.github.io/salaryflow/
          add-paths: |
            data/candidates/tax-*.json
      - name: Merge candidate-only PR
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
