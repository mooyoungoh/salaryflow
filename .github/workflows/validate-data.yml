name: Validate reference data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '17 13 1 * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active datasets and regression samples
        run: node scripts/validate-data.mjs
      - name: Test candidate PR preparation with synthetic data
        run: node scripts/test-data-pipeline.mjs
      - name: Test IRS parser against known 2026 reference tables
        run: node scripts/test-irs-parser.mjs
