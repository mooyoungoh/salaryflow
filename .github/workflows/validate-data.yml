name: Validate reference data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '17 13 1 * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active datasets and regression samples
        run: node scripts/validate-data.mjs
      - name: Verify atomic tax-year rollover rules
        run: node scripts/test-activate-tax-year.mjs
      - name: Test next-year SSA candidate parser
        run: python3 -m unittest discover -s scripts -p 'test_propose_ssa_payroll.py' -v
      - name: Test candidate PR preparation with synthetic data
        run: node scripts/test-data-pipeline.mjs
      - name: Test IRS parser against known 2026 reference tables
        run: node scripts/test-irs-parser.mjs
      - name: Compare live IRS bulletin to saved 2026 reference
        run: node scripts/test-irs-live.mjs
      - name: Test IRS bulletin index discovery without publishing
        run: node scripts/discover-irs-tax.mjs
