name: Extract IRS tax tables for review
on:
  workflow_dispatch:
    inputs:
      bulletin_url:
        description: "Official IRS Internal Revenue Bulletin URL containing the new tax rate tables"
        required: true
        type: string
      tax_year:
        description: "Tax year of the new IRS tables (for example, 2027)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-irs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check parser against existing 2026 values
        run: node scripts/test-irs-parser.mjs
      - name: Extract IRS tables (new tax year only)
        env:
          BULLETIN_URL: ${{ inputs.bulletin_url }}
          TAX_YEAR: ${{ inputs.tax_year }}
        run: node scripts/collect-irs-tax.mjs "$BULLETIN_URL" "$TAX_YEAR"
      - name: Create proposed JSON, update staging manifest and generate difference report
        id: proposal
        env:
          TAX_YEAR: ${{ inputs.tax_year }}
        run: node scripts/prepare-data-pr.mjs tax "$TAX_YEAR"
      - name: Validate staged data
        run: node scripts/validate-data.mjs
      - name: Create review PR with complete history
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Propose new IRS tax tables for ${{ inputs.tax_year }}"
          branch: "data-review/irs-tax-${{ inputs.tax_year }}"
          base: main
          title: "[IRS tax review] ${{ inputs.tax_year }} tax brackets and deductions"
          body-path: data-review-report.md
          draft: ${{ steps.proposal.outputs.auto_safe != 'true' }}
          add-paths: |
            data/*.json
            data-review-report.md
      - name: Print PR link
        if: steps.pr.outputs.pull-request-url != ''
        run: echo "${{ steps.pr.outputs.pull-request-url }}"
      - name: Auto-merge low-variance official IRS update on staging only
        if: steps.proposal.outputs.auto_safe == 'true' && steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo "Official IRS dataset passed all checks, with every reference value changing by at most 10%."
          gh pr merge "$PR_URL" --squash --delete-branch
          gh pr comment "$PR_URL" --body "@mooyoungoh — Salary Flow staging data PR was automatically merged after passing the official IRS source and <=10% change checks. Review the merge history here: $PR_URL"
