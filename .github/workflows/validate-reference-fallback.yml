name: Validate reference fallback
on:
  push:
    paths:
      - index.html
      - scripts/test-reference-fallback.mjs
      - scripts/test-arizona-tax.mjs
      - data/arizona-2026.json
      - .github/workflows/validate-reference-fallback.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-reference-fallback.mjs
      - run: node scripts/test-arizona-tax.mjs
