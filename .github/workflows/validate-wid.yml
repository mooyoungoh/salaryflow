name: Validate WID ingestion
on:
  push:
    paths:
      - 'scripts/collect-wid.mjs'
      - 'scripts/test-wid-collector.mjs'
      - 'scripts/test-wid-live.mjs'
      - '.github/workflows/validate-wid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wid:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/test-wid-collector.mjs
      - run: node scripts/test-wid-live.mjs
      - name: Ensure unpublished next-year data is skipped safely
        run: node scripts/collect-wid.mjs
