name: Notify owner when data PR merges
on:
  pull_request:
    types: [closed]
permissions:
  pull-requests: write
  issues: write
jobs:
  notify-manual-merge:
    if: ${{ github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'data-review/') || startsWith(github.event.pull_request.title, '[Data review]') || startsWith(github.event.pull_request.title, '[IRS tax review]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Mention owner on completed merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          gh pr comment "$PR_URL" --body "@mooyoungoh — Salary Flow staging reference-data PR merged by $MERGED_BY. Merge history: $PR_URL"
