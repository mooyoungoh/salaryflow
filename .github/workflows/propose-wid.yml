name: Propose WID income thresholds
on:
  workflow_dispatch:
  schedule:
    - cron: '33 16 16 * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  wid-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WID percentile parser
        run: node scripts/test-wid-collector.mjs
      - name: Collect next income-year WID data, if released
        id: wid
        run: node scripts/collect-wid.mjs
      - name: Compare and prepare review candidate
        if: steps.wid.outputs.found == 'true'
        id: candidate
        run: |
          YEAR=$(node -p "require('./data/manifest.json').world.year+1")
          node scripts/prepare-data-pr.mjs world "$YEAR"
      - name: Validate new WID candidate and active datasets
        if: steps.wid.outputs.found == 'true'
        run: node scripts/validate-data.mjs
      - name: Open WID draft PR for human verification
        if: steps.wid.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Propose next WID pre-tax national income thresholds'
          branch: data-review/wid-next-year
          base: main
          title: '[Data review] WID country thresholds update'
          body-path: data-review-report.md
          draft: true
          add-paths: |
            data/*.json
            data-review-report.md
